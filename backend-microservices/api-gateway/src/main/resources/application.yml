server:
  port: 8080

spring:
  application:
    name: api-gateway

# Timeouts du proxy vers les microservices (env vars surchargeables en prod)
app:
  proxy:
    connect-timeout-ms: ${PROXY_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${PROXY_READ_TIMEOUT_MS:100000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# URLs des microservices — overridables en prod
services:
  auth:
    url: ${SERVICE_AUTH_URL:http://localhost:8081}
  personnel:
    url: ${SERVICE_PERSONNEL_URL:http://localhost:8082}
  commission:
    url: ${SERVICE_COMMISSION_URL:http://localhost:8083}
  presence:
    url: ${SERVICE_PRESENCE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.abcdis: INFO
