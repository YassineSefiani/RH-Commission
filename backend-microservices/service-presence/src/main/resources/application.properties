# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION DU MICROSERVICE PRÉSENCE (service-presence)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=service-presence
server.port=8084

# ─── BASE DE DONNÉES PostgreSQL (Neon) ────────────────────────────────────
# ⚠ IMPORTANT : La base "rh_presence" doit être créée avant le démarrage.
#    La connexion à Neon est configurée via les variables d'environnement DB_URL_PRESENCE, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL_PRESENCE:jdbc:postgresql://localhost:5432/rh_presence}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ─── JPA / HIBERNATE ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ─── JACKSON (sérialisation des dates LocalDate/LocalTime en JSON) ──
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ─── JWT ────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ABCDisHRApp2024SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits}

# ─── LOGS ───────────────────────────────────────────────────────────
logging.level.com.abcdis=DEBUG
logging.level.org.springframework.web=INFO
