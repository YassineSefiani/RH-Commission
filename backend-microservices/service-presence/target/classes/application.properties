# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION DU MICROSERVICE PRÉSENCE (service-presence)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=service-presence
server.port=8084

# ─── BASE DE DONNÉES SQL SERVER ────────────────────────────────────
# ⚠ IMPORTANT : La base "rh_presence" doit être créée avant le démarrage.
#    Exécuter le script : backend-microservices/scripts/create-databases.sql
spring.datasource.url=${DB_URL_PRESENCE:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=rh_presence;trustServerCertificate=true;encrypt=false}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:abcdis_user}
spring.datasource.password=${DB_PASSWORD:AbcDis2024!}

# ─── JPA / HIBERNATE ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ─── JACKSON (sérialisation des dates LocalDate/LocalTime en JSON) ──
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ─── JWT ────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ABCDisHRApp2024SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits}

# ─── LOGS ───────────────────────────────────────────────────────────
logging.level.com.abcdis=DEBUG
logging.level.org.springframework.web=INFO
