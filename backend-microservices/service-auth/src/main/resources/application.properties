# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION DU MICROSERVICE AUTHENTIFICATION (service-auth)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=service-auth
server.port=8081

# ─── BASE DE DONNÉES POSTGRESQL / NEON ─────────────────────────────
# Connexion via variables d'environnement (Neon cloud database).
# La base de données est créée automatiquement lors de la création du projet Neon.
# TLS est activé par défaut (sslmode=require dans l'URL).
spring.datasource.url=${DB_URL_AUTH:jdbc:postgresql://localhost:5432/rh_auth}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ─── JPA / HIBERNATE ────────────────────────────────────────────────
# Dialecte PostgreSQL : dit à Hibernate de générer du SQL compatible PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# update = Hibernate crée les tables si elles n'existent pas,
# et met à jour le schéma si les entités changent.
# Les données existantes sont CONSERVÉES (contrairement à create-drop).
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console (utile pour le débogage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ne pas initialiser data.sql (Hibernate gère le schéma avec ddl-auto=update)
spring.sql.init.mode=never

# ─── JWT (JSON Web Token) — externalisé via env var en prod ──────────
jwt.secret=${JWT_SECRET:ABCDisHRApp2024SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ─── CORS (origines autorisées, virgule-séparées) ────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:8080}

# ─── Seed : reset des mots de passe au démarrage (dev=true, prod=false) ─
app.seed.force-password-resync=${SEED_FORCE_RESYNC:true}

# ─── LOGS ─────────────────────────────────────────────────────────
logging.level.com.abcdis.auth=DEBUG
logging.level.org.springframework.security=INFO
