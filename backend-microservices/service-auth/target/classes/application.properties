# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION DU MICROSERVICE AUTHENTIFICATION (service-auth)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=service-auth
server.port=8081

# ─── BASE DE DONNÉES SQL SERVER ────────────────────────────────────
# Connexion à SQL Server avec authentification Windows (pas de mot de passe).
# integratedSecurity=true = utilise les credentials de l'utilisateur Windows courant.
# trustServerCertificate=true = accepte le certificat auto-signé (dev local).
# encrypt=false = pas de chiffrement SSL (dev local, activer en production).
#
# ⚠ IMPORTANT : La base "rh_auth" doit être créée manuellement avant le démarrage.
#    Exécuter le script : backend-microservices/scripts/create-databases.sql
spring.datasource.url=${DB_URL_AUTH:jdbc:sqlserver://BEKYASSINE\\SQLEXPRESS;databaseName=rh_auth;trustServerCertificate=true;encrypt=false}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:abcdis_user}
spring.datasource.password=${DB_PASSWORD:AbcDis2024!}

# ─── JPA / HIBERNATE ────────────────────────────────────────────────
# Dialecte SQL Server : dit à Hibernate de générer du SQL compatible SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# update = Hibernate crée les tables si elles n'existent pas,
# et met à jour le schéma si les entités changent.
# Les données existantes sont CONSERVÉES (contrairement à create-drop).
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console (utile pour le débogage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ne pas initialiser data.sql avec SQL Server (géré par le script séparé)
spring.sql.init.mode=never

# ─── JWT (JSON Web Token) — externalisé via env var en prod ──────────
jwt.secret=${JWT_SECRET:ABCDisHRApp2024SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ─── CORS (origines autorisées, virgule-séparées) ────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:8080}

# ─── Seed : reset des mots de passe au démarrage (dev=true, prod=false) ─
app.seed.force-password-resync=${SEED_FORCE_RESYNC:true}

# ─── LOGS ─────────────────────────────────────────────────────────
logging.level.com.abcdis.auth=DEBUG
logging.level.org.springframework.security=INFO
