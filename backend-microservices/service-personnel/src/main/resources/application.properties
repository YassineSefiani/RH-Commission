# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION DU MICROSERVICE PERSONNEL (service-personnel)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=service-personnel
server.port=8082

# ─── BASE DE DONNÉES POSTGRESQL (NEON) ────────────────────────────────────
# Chaque microservice a SA PROPRE base PostgreSQL sur Neon (Database-per-Service pattern).
# Cela garantit l'isolation : ce service ne peut pas accéder aux tables des autres.
#
# Les identifiants de connexion et l'URL sont fournis via variables d'environnement
# (voir .env.neon.local). La connexion TLS est gérée automatiquement par Neon
# (sslmode=require et channel_binding=require dans l'URL).
spring.datasource.url=${DB_URL_PERSONNEL:jdbc:postgresql://localhost:5432/rh_personnel}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ─── JPA / HIBERNATE ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ─── ACTUATOR ──────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ─── LOGS ──────────────────────────────────────────────────────────
logging.level.com.abcdis.personnel=DEBUG

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB