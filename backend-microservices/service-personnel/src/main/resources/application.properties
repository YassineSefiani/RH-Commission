# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION DU MICROSERVICE PERSONNEL (service-personnel)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=service-personnel
server.port=8082

# ─── BASE DE DONNÉES SQL SERVER ────────────────────────────────────
# Chaque microservice a SA PROPRE base SQL Server (Database-per-Service pattern).
# Cela garantit l'isolation : ce service ne peut pas accéder aux tables des autres.
#
# ⚠ IMPORTANT : La base "rh_personnel" doit être créée avant le démarrage.
#    Exécuter le script : backend-microservices/scripts/create-databases.sql
spring.datasource.url=${DB_URL_PERSONNEL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=rh_personnel;trustServerCertificate=true;encrypt=false}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:abcdis_user}
spring.datasource.password=${DB_PASSWORD:AbcDis2024!}

# ─── JPA / HIBERNATE ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ─── ACTUATOR ──────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ─── LOGS ──────────────────────────────────────────────────────────
logging.level.com.abcdis.personnel=DEBUG

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB