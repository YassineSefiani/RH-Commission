# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION DU MICROSERVICE COMMISSION (service-commission)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=service-commission
server.port=8083

# ─── BASE DE DONNÉES SQL SERVER ────────────────────────────────────
# ⚠ IMPORTANT : La base "rh_commission" doit être créée avant le démarrage.
#    Exécuter le script : backend-microservices/scripts/create-databases.sql
spring.datasource.url=${DB_URL_COMMISSION:jdbc:sqlserver://BEKYASSINE\\SQLEXPRESS;databaseName=rh_commission;trustServerCertificate=true;encrypt=false}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:abcdis_user}
spring.datasource.password=${DB_PASSWORD:AbcDis2024!}

# ─── JPA / HIBERNATE ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql ne s'exécute pas automatiquement avec SQL Server + ddl-auto=update.
# Pour insérer les contraintes initiales, utiliser le script :
# backend-microservices/scripts/init-data-commission.sql
spring.sql.init.mode=never

# ─── JWT ────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ABCDisHRApp2024SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits}

# ─── LOGS ───────────────────────────────────────────────────────────
logging.level.com.abcdis=DEBUG
logging.level.org.springframework.web=INFO
