# ═══════════════════════════════════════════════════════════════════
# CONFIGURATION DU MICROSERVICE COMMISSION (service-commission)
# ═══════════════════════════════════════════════════════════════════

spring.application.name=service-commission
server.port=8083

# ─── BASE DE DONNÉES POSTGRESQL (Neon) ─────────────────────────────
# La connexion se fait via la variable d'environnement DB_URL_COMMISSION
# Exemple Neon: jdbc:postgresql://host/dbname?sslmode=require&channel_binding=require
# TLS est toujours requis (sslmode=require) pour Neon.
spring.datasource.url=${DB_URL_COMMISSION:jdbc:postgresql://localhost:5432/rh_commission}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ─── JPA / HIBERNATE ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql ne s'exécute pas automatiquement avec SQL Server + ddl-auto=update.
# Pour insérer les contraintes initiales, utiliser le script :
# backend-microservices/scripts/init-data-commission.sql
spring.sql.init.mode=never

# ─── JWT ────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ABCDisHRApp2024SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits}

# ─── LOGS ───────────────────────────────────────────────────────────
logging.level.com.abcdis=DEBUG
logging.level.org.springframework.web=INFO
