# Application
spring.application.name=abc-dis-hr-backend
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:abcdis_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (pour debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS (permet les requêtes depuis le frontend)
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JWT Configuration
jwt.secret=ABCDisHRApp2024SecretKeyForJWTTokenGenerationMustBeLongEnough256Bits
jwt.expiration=86400000